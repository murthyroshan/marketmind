<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Intelligence - SalesSpark AI</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link rel="alternate icon" type="image/png" href="./assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <img src="assets/favicon.svg" alt="SalesSpark AI">
            <span class="brand-text">SalesSpark AI</span>
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="tools.html">Tools</a>
            <a href="prediction.html">Prediction</a>
            <a href="market_intelligence.html">Market Intelligence</a>
            <a href="sales_copilot.html">Sales Copilot</a>
            <a href="leads.html">Leads</a>
        </div>
    </nav>

    <div class="status-strip" id="statusStrip">
        <span class="status-item"><span class="status-live"></span> LIVE</span>
        <span class="status-item">PIPELINE <b id="st-total">--</b></span>
        <span class="status-item hot">HOT <b id="st-hot">--</b></span>
        <span class="status-item warm">WARM <b id="st-warm">--</b></span>
        <span class="status-item">AVG <b id="st-avg">--</b></span>
        <span class="status-item up">HEALTH <b id="st-health">--</b></span>
    </div>

    <section class="container">
        <h1 class="page-title">Prediction</h1>
        <p class="page-subtitle">Forecast engagement, conversion and risk before you spend</p>
    </section>

    <section class="container">
        <div class="card" style="max-width:560px;">
            <h3>Campaign Forecast</h3>
            <div class="input-group">
                <label>Target Platform</label>
                <select id="pred_platform">
                    <option value="LinkedIn">LinkedIn</option>
                    <option value="Email">Email</option>
                    <option value="Instagram">Instagram</option>
                    <option value="Twitter">Twitter</option>
                </select>
            </div>
            <div class="input-group">
                <label>Campaign Goal</label>
                <select id="pred_goal">
                    <option value="Leads">Lead Generation</option>
                    <option value="Sales">Direct Sales</option>
                    <option value="Awareness">Brand Awareness</option>
                </select>
            </div>
            <button class="tool-btn" onclick="predictCampaign()">Predict Outcomes</button>
            <div id="pred_output" class="output"></div>
        </div>
    </section>

    <footer>
        <p>SalesSpark AI &middot; Sales Intelligence Terminal &middot; 2026</p>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/prediction_page.js"></script>
</body>

</html>
